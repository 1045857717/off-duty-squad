name: "Feature / 功能建议"
description: "Suggest a focused improvement / 提出具体改进建议"
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / 要解决的问题"
      description: "Describe the player experience and when it happens. 描述实际使用场景。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal / 建议方案"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and tradeoffs / 其他方案与取舍"
