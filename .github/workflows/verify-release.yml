name: Verify published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable image version (without v)"
        required: true
        default: "4.1.0"
        type: string

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RELEASE_TAG: v${{ inputs.version }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Pull and verify published platform image
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          docker pull --platform "$DOCKER_DEFAULT_PLATFORM" "$image"
          expected_arch="arm64"
          if [ "$DOCKER_DEFAULT_PLATFORM" = "linux/amd64" ]; then expected_arch="x64"; fi
          docker run --rm --platform "$DOCKER_DEFAULT_PLATFORM" --entrypoint node "$image" -e 'if (process.arch !== process.argv[1]) throw new Error("Architecture mismatch"); console.log(JSON.stringify({architecture:process.arch,platform:process.platform}));' "$expected_arch"
          node scripts/container-smoke.mjs --image "$image" --desktop
