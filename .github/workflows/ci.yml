name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run release:check
      - run: npm run check

  container:
    name: Source-only container smoke test
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: docker compose -f compose.prod.yaml config --quiet
      - run: docker compose -f compose.yaml config --quiet
      - run: docker build --tag off-duty:ci .
      - run: node scripts/container-smoke.mjs --image off-duty:ci

  browser:
    name: Browser combat and compact window
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:lobby
      - run: npm run test:community
      - run: npm run test:work
      - run: npm run test:playability
      - run: npm run test:undead
      - run: npm run test:art
      - run: npm run test:rigs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-combat-and-compact-window
          path: |
            test-results/lobby41
            test-results/community
            test-results/work41
            test-results/playability41
            test-results/undead39
            test-results/art40
            test-results/art40-rig-audit
          if-no-files-found: ignore
          retention-days: 7
