services:
  off-duty:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /app/data
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - abyss-scores:/app/data
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  abyss-scores:
